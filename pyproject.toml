[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.2.0"
description = "Local transactional agent memory with optional BYOK and model adapters"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akash Yadav" }]
keywords = ["agents", "memory", "retrieval", "knowledge-graph"]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.5,<0.8"]
semantic = ["sentence-transformers>=3.3,<6"]
laya = ["laya>=0.4.14,<0.5"]

[project.scripts]
engram = "engram.cli:main"

[tool.setuptools]
packages = ["engram"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
